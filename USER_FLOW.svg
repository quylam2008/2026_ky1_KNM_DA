<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="3820" viewBox="0 0 1600 3820" role="img" aria-labelledby="title description">
  <title id="title">User flow — Focust</title>
  <desc id="description">Sơ đồ hành trình người dùng từ đăng nhập, tập trung học, nhận thưởng đến các mục điều hướng của Focust.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#6c8275"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#173e2f" flood-opacity=".08"/>
    </filter>
    <style>
      text { font-family: Inter, "Segoe UI", Arial, sans-serif; fill: #173e2f; }
      .title { font-size: 46px; font-weight: 750; letter-spacing: -1.5px; }
      .subtitle { font-size: 18px; fill: #718078; }
      .section { font-size: 16px; font-weight: 750; letter-spacing: 2px; fill: #779080; }
      .node { fill: #ffffff; stroke: #dce7dc; stroke-width: 2; }
      .main { fill: #174d38; stroke: #174d38; }
      .mainText { fill: #ffffff; }
      .gold { fill: #fff7e6; stroke: #e8cf91; }
      .muted { fill: #f3f7f2; stroke: #dce7dc; }
      .nodeTitle { font-size: 19px; font-weight: 700; }
      .body { font-size: 15px; fill: #65756b; }
      .small { font-size: 13px; fill: #718078; }
      .tag { font-size: 13px; font-weight: 700; fill: #4d765f; }
      .line { fill: none; stroke: #809587; stroke-width: 3; marker-end: url(#arrow); }
      .linePlain { fill: none; stroke: #c4d2c7; stroke-width: 2.5; }
      .divider { stroke: #e7eee7; stroke-width: 1.5; }
    </style>
  </defs>

  <rect width="1600" height="3820" fill="#f5f8f4"/>
  <circle cx="1450" cy="90" r="180" fill="#e8f0e6"/>
  <circle cx="75" cy="3700" r="150" fill="#edf3ea"/>

  <text x="100" y="92" class="section">FOCUST · HÀNH TRÌNH NGƯỜI DÙNG</text>
  <text x="100" y="151" class="title">User flow</text>
  <text x="100" y="187" class="subtitle">Từ tạo tài khoản đến tập trung, nhận thưởng và phát triển khu vườn.</text>
  <rect x="1310" y="112" width="190" height="42" rx="21" fill="#e5efe4"/>
  <text x="1405" y="139" text-anchor="middle" class="tag">SƠ ĐỒ TỔNG QUAN</text>

  <text x="100" y="255" class="section">01 · VÀO ỨNG DỤNG</text>
  <rect x="650" y="220" width="300" height="70" rx="35" class="main" filter="url(#shadow)"/>
  <text x="800" y="263" text-anchor="middle" class="nodeTitle mainText">Mở Focust</text>

  <path d="M800 290 V325" class="line"/>
  <polygon points="800,330 930,390 800,450 670,390" fill="#fff7e6" stroke="#e8cf91" stroke-width="2"/>
  <text x="800" y="384" text-anchor="middle" class="nodeTitle">Đã có phiên</text>
  <text x="800" y="407" text-anchor="middle" class="nodeTitle">đăng nhập?</text>

  <path d="M670 390 H460 V470" class="line"/>
  <text x="535" y="378" class="tag">Chưa</text>
  <path d="M930 390 H1140 V470" class="line"/>
  <text x="1015" y="378" class="tag">Rồi</text>

  <rect x="100" y="470" width="720" height="225" rx="26" class="node" filter="url(#shadow)"/>
  <text x="135" y="515" class="nodeTitle">Đăng nhập / đăng ký</text>
  <text x="135" y="545" class="body">Đăng nhập bằng username và mật khẩu</text>
  <line x1="135" y1="565" x2="785" y2="565" class="divider"/>
  <rect x="135" y="585" width="280" height="78" rx="16" class="muted"/>
  <text x="160" y="616" class="tag">TẠO TÀI KHOẢN</text>
  <text x="160" y="642" class="small">Tên · username · email · mật khẩu</text>
  <rect x="435" y="585" width="350" height="78" rx="16" class="muted"/>
  <text x="460" y="616" class="tag">QUÊN MẬT KHẨU?</text>
  <text x="460" y="642" class="small">Nhập email để nhận hướng dẫn đặt lại</text>
  <path d="M820 595 H870 V535 H990" class="line"/>
  <text x="880" y="520" class="small">Thành công</text>

  <rect x="990" y="470" width="510" height="135" rx="26" class="node" filter="url(#shadow)"/>
  <text x="1030" y="520" class="nodeTitle">Đồng bộ dữ liệu</text>
  <text x="1030" y="551" class="body">Tải hồ sơ, ví, task, tiến độ và thông báo</text>
  <path d="M1245 605 V735 H800" class="linePlain"/>
  <path d="M800 735 V765" class="line"/>
  <rect x="650" y="770" width="300" height="72" rx="24" class="main" filter="url(#shadow)"/>
  <text x="800" y="815" text-anchor="middle" class="nodeTitle mainText">Home</text>

  <text x="100" y="915" class="section">02 · PHIÊN TẬP TRUNG</text>
  <path d="M800 842 V875" class="line"/>
  <rect x="570" y="880" width="460" height="76" rx="20" class="node" filter="url(#shadow)"/>
  <text x="800" y="912" text-anchor="middle" class="nodeTitle">Chọn hoặc tạo task học tập</text>
  <text x="800" y="938" text-anchor="middle" class="body">Ví dụ: môn học · bài tập · dự án</text>

  <path d="M800 956 V985" class="line"/>
  <rect x="570" y="990" width="460" height="76" rx="20" class="node" filter="url(#shadow)"/>
  <text x="800" y="1022" text-anchor="middle" class="nodeTitle">Chọn thời lượng và cây</text>
  <text x="800" y="1048" text-anchor="middle" class="body">25 / 45 / 60 phút hoặc tùy chỉnh · cây sở hữu</text>

  <path d="M800 1066 V1095" class="line"/>
  <rect x="650" y="1100" width="300" height="72" rx="24" class="main" filter="url(#shadow)"/>
  <text x="800" y="1145" text-anchor="middle" class="nodeTitle mainText">Bắt đầu phiên</text>
  <path d="M800 1172 V1200" class="line"/>
  <polygon points="800,1205 930,1260 800,1315 670,1260" fill="#fff7e6" stroke="#e8cf91" stroke-width="2"/>
  <text x="800" y="1255" text-anchor="middle" class="nodeTitle">Hoàn thành</text>
  <text x="800" y="1278" text-anchor="middle" class="nodeTitle">phiên?</text>
  <path d="M930 1260 H1080 V1165 H970" class="line"/>
  <text x="1100" y="1210" class="tag">Chưa · tạm dừng</text>
  <text x="1100" y="1232" class="small">hoặc tiếp tục phiên</text>
  <path d="M800 1315 V1350" class="line"/>
  <text x="820" y="1340" class="tag">Hoàn thành</text>

  <rect x="570" y="1355" width="460" height="78" rx="20" class="node" filter="url(#shadow)"/>
  <text x="800" y="1388" text-anchor="middle" class="nodeTitle">Lưu phiên và cập nhật tiến độ</text>
  <text x="800" y="1415" text-anchor="middle" class="body">Cập nhật phút tập trung và streak</text>
  <path d="M800 1433 V1460" class="line"/>
  <polygon points="800,1465 930,1520 800,1575 670,1520" fill="#fff7e6" stroke="#e8cf91" stroke-width="2"/>
  <text x="800" y="1515" text-anchor="middle" class="nodeTitle">Đủ điều kiện</text>
  <text x="800" y="1538" text-anchor="middle" class="nodeTitle">nhận Xu?</text>
  <path d="M670 1520 H470 V1590" class="line"/>
  <text x="540" y="1508" class="tag">Có</text>
  <path d="M930 1520 H1130 V1590" class="line"/>
  <text x="1010" y="1508" class="tag">Chưa</text>

  <rect x="250" y="1595" width="440" height="76" rx="20" class="gold" filter="url(#shadow)"/>
  <text x="470" y="1628" text-anchor="middle" class="nodeTitle">Cộng Xu vào ví</text>
  <text x="470" y="1654" text-anchor="middle" class="body">Đủ tối thiểu 25 phút tập trung</text>
  <rect x="910" y="1595" width="440" height="76" rx="20" class="muted" filter="url(#shadow)"/>
  <text x="1130" y="1628" text-anchor="middle" class="nodeTitle">Lưu phiên</text>
  <text x="1130" y="1654" text-anchor="middle" class="body">Không cộng Xu nếu chưa đủ điều kiện</text>

  <path d="M470 1671 V1700 H800" class="linePlain"/>
  <path d="M1130 1671 V1700 H800" class="linePlain"/>
  <path d="M800 1700 V1720" class="line"/>
  <rect x="650" y="1720" width="300" height="64" rx="22" fill="#e5efe4" stroke="#ccddce" stroke-width="2"/>
  <text x="800" y="1760" text-anchor="middle" class="nodeTitle">Quay lại Home</text>

  <text x="100" y="1845" class="section">03 · ĐIỀU HƯỚNG CHÍNH</text>
  <text x="1500" y="1845" text-anchor="end" class="small">Thanh điều hướng luôn sẵn sàng trong app</text>

  <rect x="80" y="1880" width="450" height="170" rx="24" class="node" filter="url(#shadow)"/>
  <rect x="80" y="1880" width="450" height="48" rx="24" fill="#e5efe4"/>
  <text x="110" y="1912" class="nodeTitle">Home</text>
  <text x="110" y="1960" class="body">• Phiên tập trung và task học tập</text>
  <text x="110" y="1988" class="body">• Vùng tập trung: quét máy, nhóm app</text>
  <text x="110" y="2016" class="body">• Mục tiêu, tiến độ và thông báo</text>

  <rect x="575" y="1880" width="450" height="170" rx="24" class="node" filter="url(#shadow)"/>
  <rect x="575" y="1880" width="450" height="48" rx="24" fill="#e5efe4"/>
  <text x="605" y="1912" class="nodeTitle">Xếp hạng</text>
  <text x="605" y="1960" class="body">• Theo dõi bảng xếp hạng Top 100</text>
  <text x="605" y="1988" class="body">• Xem cấp bậc và thành tích tập trung</text>

  <rect x="1070" y="1880" width="450" height="170" rx="24" class="node" filter="url(#shadow)"/>
  <rect x="1070" y="1880" width="450" height="48" rx="24" fill="#e5efe4"/>
  <text x="1100" y="1912" class="nodeTitle">Khu vườn · Cửa hàng</text>
  <text x="1100" y="1960" class="body">• Xem, lọc và yêu thích cây đã sở hữu</text>
  <text x="1100" y="1988" class="body">• Dùng Xu mua cây; VIP mở cây đặc biệt</text>
  <text x="1100" y="2016" class="body">• Chọn cây trong vườn cho phiên học</text>

  <rect x="80" y="2070" width="1440" height="170" rx="24" class="node" filter="url(#shadow)"/>
  <rect x="80" y="2070" width="1440" height="48" rx="24" fill="#e5efe4"/>
  <text x="110" y="2102" class="nodeTitle">Tài khoản</text>
  <text x="110" y="2150" class="body">• Cập nhật hồ sơ và mục tiêu học tập · quản lý cài đặt thông báo</text>
  <text x="110" y="2178" class="body">• Quét USB/OTG trên Android · VIP mở cây đặc biệt · dữ liệu demo dành cho quản trị viên</text>
  <text x="110" y="2206" class="body">• Đăng xuất để quay lại màn hình đăng nhập</text>
  <text x="100" y="2375" class="section">04 · QUÉT VÀ PHÂN LOẠI ỨNG DỤNG</text>
  <text x="1500" y="2375" text-anchor="end" class="small">Thiết lập tại Home → Vùng tập trung</text>

  <rect x="80" y="2410" width="430" height="150" rx="24" class="node" filter="url(#shadow)"/>
  <circle cx="120" cy="2452" r="19" fill="#e5efe4"/>
  <text x="120" y="2458" text-anchor="middle" class="tag">1</text>
  <text x="155" y="2458" class="nodeTitle">Quét máy</text>
  <text x="110" y="2500" class="body">Tìm ứng dụng có thể phân loại</text>
  <text x="110" y="2528" class="small">Không hỗ trợ? Ứng dụng báo giới hạn nền tảng.</text>

  <path d="M510 2485 H585" class="line"/>
  <rect x="600" y="2410" width="430" height="150" rx="24" class="node" filter="url(#shadow)"/>
  <circle cx="640" cy="2452" r="19" fill="#e5efe4"/>
  <text x="640" y="2458" text-anchor="middle" class="tag">2</text>
  <text x="675" y="2458" class="nodeTitle">Chọn ứng dụng</text>
  <text x="630" y="2500" class="body">Danh sách app được đồng bộ</text>
  <text x="630" y="2528" class="small">Có thể quét lại khi cần cập nhật danh sách.</text>

  <path d="M1030 2485 H1105" class="line"/>
  <rect x="1120" y="2410" width="400" height="150" rx="24" class="node" filter="url(#shadow)"/>
  <circle cx="1160" cy="2452" r="19" fill="#e5efe4"/>
  <text x="1160" y="2458" text-anchor="middle" class="tag">3</text>
  <text x="1195" y="2458" class="nodeTitle">Chọn nhóm → Lưu</text>
  <text x="1150" y="2500" class="body">Chọn Đỏ, Vàng hoặc Xanh</text>
  <text x="1150" y="2528" class="small">Mỗi app thuộc một nhóm; có thể đổi lại.</text>

  <path d="M1320 2560 V2600 H800" class="linePlain"/>
  <path d="M800 2600 H305 V2625" class="linePlain"/>
  <path d="M800 2600 V2625" class="linePlain"/>
  <path d="M800 2600 H1295 V2625" class="linePlain"/>

  <rect x="80" y="2630" width="450" height="230" rx="24" fill="#fff0ed" stroke="#efc7c0" stroke-width="2" filter="url(#shadow)"/>
  <rect x="80" y="2630" width="450" height="50" rx="24" fill="#cf6757"/>
  <text x="110" y="2663" class="nodeTitle mainText">ĐỎ · Cảnh báo khi mở</text>
  <text x="110" y="2710" class="body">• Hiện cảnh báo “Cây đang héo dần”.</text>
  <text x="110" y="2738" class="body">• Nếu bấm app trong giao diện, timer dừng</text>
  <text x="128" y="2762" class="body">và trở về thời lượng đã chọn.</text>
  <text x="110" y="2800" class="small">Trong phiên Android, có thể được theo dõi.</text>
  <text x="110" y="2825" class="small">Chỉ nhắc nhở, không chặn ứng dụng.</text>

  <rect x="575" y="2630" width="450" height="230" rx="24" fill="#fff7e6" stroke="#ead7a8" stroke-width="2" filter="url(#shadow)"/>
  <rect x="575" y="2630" width="450" height="50" rx="24" fill="#c89637"/>
  <text x="605" y="2663" class="nodeTitle mainText">VÀNG · Nhắc nhở</text>
  <text x="605" y="2710" class="body">• Hiện lời nhắc cân nhắc trước khi rời app.</text>
  <text x="605" y="2738" class="body">• Timer không bị reset bởi lời nhắc này.</text>
  <text x="605" y="2776" class="body">• Có thể được theo dõi trong phiên Android.</text>
  <text x="605" y="2815" class="small">Chỉ nhắc nhở, không chặn ứng dụng.</text>

  <rect x="1070" y="2630" width="450" height="230" rx="24" fill="#edf6ef" stroke="#c8ddce" stroke-width="2" filter="url(#shadow)"/>
  <rect x="1070" y="2630" width="450" height="50" rx="24" fill="#4d8a69"/>
  <text x="1100" y="2663" class="nodeTitle mainText">XANH · Được phép</text>
  <text x="1100" y="2710" class="body">• Ứng dụng được phép sử dụng.</text>
  <text x="1100" y="2738" class="body">• Không hiện cảnh báo Đỏ/Vàng.</text>
  <text x="1100" y="2776" class="body">• Có thể chuyển nhóm bất cứ lúc nào.</text>
  <text x="1100" y="2815" class="small">Chọn ứng dụng → chọn nhóm → lưu thay đổi.</text>

  <text x="100" y="2925" class="section">05 · HỖ TRỢ THEO NỀN TẢNG</text>
  <rect x="80" y="2960" width="450" height="190" rx="24" class="node" filter="url(#shadow)"/>
  <text x="115" y="3005" class="nodeTitle">Android native</text>
  <text x="115" y="3045" class="body">• Cấp Usage access và quyền thông báo.</text>
  <text x="115" y="3073" class="body">• Theo dõi app Đỏ/Vàng trong phiên.</text>
  <text x="115" y="3101" class="body">• Dừng theo dõi khi tạm dừng/hết giờ.</text>
  <text x="115" y="3129" class="small">Thiếu quyền? Mở cài đặt → bật → kiểm tra lại.</text>

  <rect x="575" y="2960" width="450" height="190" rx="24" class="node" filter="url(#shadow)"/>
  <text x="610" y="3005" class="nodeTitle">iOS</text>
  <text x="610" y="3045" class="body">• Tự tạo Shortcut cho từng app Đỏ/Vàng.</text>
  <text x="610" y="3073" class="body">• Automation: app được mở → hiện nhắc nhở.</text>
  <text x="610" y="3101" class="body">• Shortcut không biết timer có đang chạy.</text>
  <text x="610" y="3129" class="small">Focust không tự giám sát app foreground trên iOS.</text>

  <rect x="1070" y="2960" width="450" height="190" rx="24" class="node" filter="url(#shadow)"/>
  <text x="1105" y="3005" class="nodeTitle">Trình duyệt</text>
  <text x="1105" y="3045" class="body">• Không thể quét danh sách app đã cài.</text>
  <text x="1105" y="3073" class="body">• Không theo dõi app đang mở bên ngoài.</text>
  <text x="1105" y="3101" class="body">• Có thể quản lý nhóm app đã có trong app.</text>
  <text x="1105" y="3129" class="small">Khả năng quét tùy thuộc nền tảng native.</text>

  <text x="100" y="3220" class="section">06 · CÁC HÀNH TRÌNH KHÁC</text>
  <rect x="80" y="3255" width="700" height="220" rx="24" class="node" filter="url(#shadow)"/>
  <rect x="80" y="3255" width="700" height="50" rx="24" fill="#e5efe4"/>
  <text x="115" y="3288" class="nodeTitle">Cửa hàng → Khu vườn</text>
  <text x="115" y="3335" class="body">1. Nhận 200 Xu mỗi ngày (nếu chưa nhận hôm nay).</text>
  <text x="115" y="3363" class="body">2. Chọn tab “Bằng Xu” hoặc “Đặc biệt VIP”.</text>
  <text x="115" y="3391" class="body">3. Mua cây thường bằng Xu; cây VIP mở thông tin gói VIP.</text>
  <text x="115" y="3419" class="body">4. Mua thành công vào ví; cây VIP mở khi tài khoản có VIP.</text>
  <text x="115" y="3447" class="small">VIP chưa kết nối thanh toán; lỗi mua được báo. Vườn có bộ lọc/yêu thích.</text>

  <rect x="820" y="3255" width="700" height="220" rx="24" class="node" filter="url(#shadow)"/>
  <rect x="820" y="3255" width="700" height="50" rx="24" fill="#e5efe4"/>
  <text x="855" y="3288" class="nodeTitle">Tài khoản và mục tiêu</text>
  <text x="855" y="3335" class="body">1. Xem Xu, tổng thời gian tập trung và streak.</text>
  <text x="855" y="3363" class="body">2. Sửa hồ sơ, mục tiêu ngày/tháng, cài đặt thông báo.</text>
  <text x="855" y="3391" class="body">3. Thiết bị IoT: quét USB/OTG trên Android native.</text>
  <text x="855" y="3419" class="body">4. Dữ liệu demo chỉ có ở tài khoản quản trị được cấp quyền.</text>
  <text x="855" y="3447" class="small">Đăng xuất → quay về màn hình đăng nhập.</text>

  <rect x="80" y="3500" width="700" height="170" rx="24" class="node" filter="url(#shadow)"/>
  <rect x="80" y="3500" width="700" height="50" rx="24" fill="#e5efe4"/>
  <text x="115" y="3533" class="nodeTitle">Thông báo</text>
  <text x="115" y="3580" class="body">Mở từ biểu tượng chuông → xem danh sách và số chưa đọc.</text>
  <text x="115" y="3608" class="body">Chọn một tin để đánh dấu đã đọc hoặc chọn đọc tất cả.</text>
  <text x="115" y="3636" class="small">Thông báo được lưu trong app; push khi app đóng cần cấu hình thêm.</text>

  <rect x="820" y="3500" width="700" height="170" rx="24" class="node" filter="url(#shadow)"/>
  <rect x="820" y="3500" width="700" height="50" rx="24" fill="#e5efe4"/>
  <text x="855" y="3533" class="nodeTitle">Xếp hạng</text>
  <text x="855" y="3580" class="body">Chọn Xếp hạng trên thanh điều hướng → xem Top 100.</text>
